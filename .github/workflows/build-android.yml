name: Android Build

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  android:
    name: Android
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - abi: arm64
            arch: "-arm64"
          - abi: armv7
            arch: "-armv7"
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: 4.2.5
          cache-dependency-path: hmm.json

      - name: Restore build cache
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: export/release/android
          key: seiu-export-android-${{ matrix.abi }}-v1-${{ hashFiles('Project.xml', 'hmm.json') }}

      - uses: ./.github/actions/build-android
        with:
          abi: ${{ matrix.abi }}
          arch: ${{ matrix.arch }}
          gh-pat: ${{ secrets.GH_PAT }}

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-android-${{ matrix.abi }}
          path: SeiunEngine-android-${{ matrix.abi }}-${{ env.APP_VERSION }}.apk
          if-no-files-found: error
          retention-days: 14
