name: Alpha Release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Numeric build run ID (e.g. 31261975698; leave empty to use the latest Build run)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish alpha release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Resolve build run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RUN_ID="${{ github.event.inputs.run_id }}"
          if [ -n "$RUN_ID" ] && ! [[ "$RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::warning::run_id is not numeric ($RUN_ID), falling back to the latest Build run"
            RUN_ID=""
          fi
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list --workflow main.yml --branch main --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          echo "RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "using build run: $RUN_ID"

      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Package release assets
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist
          cd release
          for d in */; do
            d="${d%/}"
            [ -d "$d" ] || continue
            mobile=0
            for f in "$d"/*.apk "$d"/*.ipa; do
              if [ -f "$f" ]; then
                cp "$f" ../dist/
                mobile=1
              fi
            done
            if [ "$mobile" -eq 0 ] && [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              zip -r "../dist/${d}.zip" "$d"
            fi
          done
          cd ../dist
          shopt -s nullglob
          files=(*.apk *.ipa *.zip)
          if [ "${#files[@]}" -gt 0 ]; then
            sha256sum "${files[@]}" > SHA256SUMS.txt
          fi
          ls -la

      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.APP_VERSION }}-alpha.${{ env.RUN_ID }}
          name: Alpha v${{ env.APP_VERSION }} (build ${{ env.RUN_ID }})
          prerelease: true
          body: |
            Automated alpha pre-release from Build workflow run ${{ env.RUN_ID }}.

            Artifacts:
            - Linux x64
            - Windows x64
            - macOS x64
            - macOS arm64 (experimental)
            - Android (APK)
            - iOS Device (IPA)

            Checksums are included in `SHA256SUMS.txt`.
          files: dist/*
