name: Build

# Actions 已按仓库策略钉死到完整 commit SHA。
# hmm.json 指向 mohong2 名下的私有 fork，需在仓库 secrets 里配置 GH_PAT（只读）。

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 要构建的平台（all = 全部）
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - android
          - macos
          - ios

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HAXE_VERSION: "4.2.5"

jobs:
  buildLinux:
    name: Build Linux
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'linux'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev libpulse0 zenity \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev \
            libasound2-dev libxext-dev libxi-dev libxrandr-dev libxinerama-dev \
            libmbedtls-dev libpng-dev libturbojpeg-dev libvorbis-dev \
            libpulse-dev libdbus-1-dev libudev-dev libibus-1.0-dev libwayland-dev

      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          GH_PAT="$(printf '%s' "$GH_PAT" | tr -d '\r\n')"
          echo "GH_PAT length: ${#GH_PAT}"
          if [ -n "$GH_PAT" ]; then
            B64="$(printf '%s' "x-access-token:${GH_PAT}" | base64 | tr -d '\r\n')"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${B64}"
            echo 'git auth configured (GH_PAT found)'
            git ls-remote https://github.com/mohong2/flixel.git HEAD && echo 'private repo access OK'
          else
            echo '::warning::GH_PAT not set - private deps will fail'
          fi

      - name: Install haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp

      - name: Init discord_rpc submodules
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Rebuild Lime Linux ndll (SDL3)
        run: haxelib run lime rebuild linux -64 -release -Dlime-sdl3

      - name: Compile
        run: haxelib run lime build linux --app-version="$APP_VERSION-${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-linux
          path: export/release/linux/bin
          if-no-files-found: error
          retention-days: 14

  buildWindows:
    name: Build Windows
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          $GH_PAT = $env:GH_PAT -replace "[\r\n]", ""
          Write-Output "GH_PAT length: $($GH_PAT.Length)"
          if ($GH_PAT) {
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$GH_PAT"))
            git config --local --unset-all http.https://github.com/.extraheader 2>$null
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $b64"
            Write-Output 'git auth configured (GH_PAT found)'
            git ls-remote https://github.com/mohong2/flixel.git HEAD
            if ($LASTEXITCODE -eq 0) { Write-Output 'private repo access OK' } else { exit 1 }
          } else {
            Write-Output '::warning::GH_PAT not set - private deps will fail'
          }

      - name: Install haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp

      - name: Init discord_rpc submodules
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Read app version
        run: |
          $xml = Get-Content -Raw Project.xml
          $v = [regex]::Match($xml, '<app[^>]*version="([0-9][0-9.]*)"').Groups[1].Value
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Rebuild Lime Windows ndll (SDL3)
        run: haxelib run lime rebuild windows -64 -release -Dlime-sdl3

      - name: Compile
        run: haxelib run lime build windows --app-version="$env:APP_VERSION-${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-windows
          path: export/release/windows/bin
          if-no-files-found: error
          retention-days: 14

  buildAndroid:
    name: Build Android
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'android'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17" # sdkmanager 需要 JDK 17

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          $GH_PAT = $env:GH_PAT -replace "[\r\n]", ""
          Write-Output "GH_PAT length: $($GH_PAT.Length)"
          if ($GH_PAT) {
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$GH_PAT"))
            git config --local --unset-all http.https://github.com/.extraheader 2>$null
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $b64"
            Write-Output 'git auth configured (GH_PAT found)'
            git ls-remote https://github.com/mohong2/flixel.git HEAD
            if ($LASTEXITCODE -eq 0) { Write-Output 'private repo access OK' } else { exit 1 }
          } else {
            Write-Output '::warning::GH_PAT not set - private deps will fail'
          }

      - name: Install Android SDK components
        run: |
          $SDKMANAGER = "$env:ANDROID_HOME\cmdline-tools\latest\bin\sdkmanager.bat"
          1..20 | ForEach-Object { "y" } | & $SDKMANAGER --licenses 2>$null | Out-Null
          # SDL3 java 层需要 compileSdk 33 (TIRAMISU/RECEIVER_EXPORTED), 见 lime fork 模板 gradle.properties
          & $SDKMANAGER "platforms;android-33" "build-tools;34.0.0" "platform-tools" "ndk;21.4.7075529"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SDK=$env:ANDROID_HOME"
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_NDK_ROOT=$env:ANDROID_HOME\ndk\21.4.7075529"
          Add-Content -Path $env:GITHUB_ENV -Value "ANDROID_SETUP=true"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "11" # gradle 构建（AGP 7.4.2 / Gradle 7.5 / compileSdk 33）需要 JDK 11

      - name: Install haxelib dependencies
        run: |
          haxelib setup "$HOME/haxelib"
          haxe -cp ./setup -main Main --interp

      - name: Configure Android SDK
        run: |
          "$env:ANDROID_SDK`n$env:ANDROID_NDK_ROOT`n$env:JAVA_HOME" | haxelib run lime setup android

      - name: Init discord_rpc submodules
        run: |
          cd "$HOME/haxelib/discord_rpc/git"
          git submodule update --init --recursive

      - name: Apply Android template patches
        # lime fork 模板已升级 AGP7/SDL3 java/命名空间, 这里只覆盖用户自定义文件,
        # 不再覆盖 build.gradle / gradle.properties (避免退回 AGP4 写法导致构建失败)
        run: |
          $LT = "$HOME/haxelib/lime/git/templates/android/template"
          New-Item -ItemType Directory -Force -Path "$LT/app/src/main/java/org/haxe/extension", "$LT/app/src/main/res/drawable" | Out-Null
          Copy-Item "templates/android/java/org/haxe/extension/SeiunOverlay.java" "$LT/app/src/main/java/org/haxe/extension/SeiunOverlay.java" -Force
          Copy-Item "templates/android/template/app/src/main/res/drawable/seiun_ic_keyboard.xml" "$LT/app/src/main/res/drawable/seiun_ic_keyboard.xml" -Force
          Copy-Item "templates/android/template/app/src/main/AndroidManifest.xml" "$LT/app/src/main/AndroidManifest.xml" -Force

      - name: Read app version
        run: |
          $xml = Get-Content -Raw Project.xml
          $v = [regex]::Match($xml, '<app[^>]*version="([0-9][0-9.]*)"').Groups[1].Value
          Add-Content -Path $env:GITHUB_ENV -Value "APP_VERSION=$v"

      - name: Rebuild Lime Android ndll (SDL3)
        run: haxelib run lime rebuild android -release -Dlime-sdl3

      - name: Compile Android
        env:
          _JAVA_OPTIONS: "-Xmx5g -XX:MaxMetaspaceSize=1g"
        run: haxelib run lime build android --app-version="$env:APP_VERSION-${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-android
          path: export/release/android/bin/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

  buildMac:
    name: Build macOS
    # linc_luajit 预编译库仅 x86_64，须用 Intel runner；macOS 10x 计费
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'macos'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          GH_PAT="$(printf '%s' "$GH_PAT" | tr -d '\r\n')"
          echo "GH_PAT length: ${#GH_PAT}"
          if [ -n "$GH_PAT" ]; then
            B64="$(printf '%s' "x-access-token:${GH_PAT}" | base64 | tr -d '\r\n')"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${B64}"
            echo 'git auth configured (GH_PAT found)'
            git ls-remote https://github.com/mohong2/flixel.git HEAD && echo 'private repo access OK'
          else
            echo '::warning::GH_PAT not set - private deps will fail'
          fi

      - name: Install haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp

      - name: Patch hxcpp zlib for modern macOS SDK
        run: |
          find "$HOME/haxelib/hxcpp" -path '*/thirdparty/zlib-*/zutil.h' -exec sed -i.bak '/# *define fdopen(fd,mode) NULL/d' {} +
          find "$HOME/haxelib/hxcpp" -path '*/thirdparty/zlib-*/zutil.h.bak' -delete
          ! grep -rq 'define fdopen(fd,mode) NULL' "$HOME/haxelib/hxcpp"

      - name: Silence unused -stdlib=libc++ warning on macOS
        run: |
          find "$HOME/haxelib/hxcpp" -path '*/toolchain/mac-toolchain.xml' \
            -exec perl -0pi -e 's{(<flag value="-stdlib=libc\+\+" unless="STDLIBCPP" />)}{$1\n  <flag value="-Wno-unused-command-line-argument" if="HXCPP_CLANG" />}' {} +
          find "$HOME/haxelib/hxcpp" -path '*/toolchain/mac-toolchain.xml' -exec grep -q 'Wno-unused-command-line-argument' {} \;

      - name: Init discord_rpc submodules
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Rebuild Lime macOS ndll (SDL3)
        run: haxelib run lime rebuild mac -64 -release -Dlime-sdl3

      - name: Compile
        run: haxelib run lime build mac --app-version="$APP_VERSION-${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-mac
          path: export/release/macos/bin
          if-no-files-found: error
          retention-days: 14

  buildIOS:
    name: Build iOS (device)
    # Intel runner 编 x86_64 模拟器时 hxvlc 只有 arm64 库会链接失败，
    # 真机 arm64 两个库都齐；用 ad-hoc 签名绕开证书
    if: github.event.inputs.platform == 'all' || github.event.inputs.platform == 'ios'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          GH_PAT="$(printf '%s' "$GH_PAT" | tr -d '\r\n')"
          echo "GH_PAT length: ${#GH_PAT}"
          if [ -n "$GH_PAT" ]; then
            B64="$(printf '%s' "x-access-token:${GH_PAT}" | base64 | tr -d '\r\n')"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${B64}"
            echo 'git auth configured (GH_PAT found)'
            git ls-remote https://github.com/mohong2/flixel.git HEAD && echo 'private repo access OK'
          else
            echo '::warning::GH_PAT not set - private deps will fail'
          fi

      - name: Install haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp

      - name: Patch hxcpp zlib for iOS 18 SDK
        run: |
          find "$HOME/haxelib/hxcpp" -path '*/thirdparty/zlib-*/zutil.h' -exec sed -i.bak '/# *define fdopen(fd,mode) NULL/d' {} +
          find "$HOME/haxelib/hxcpp" -path '*/thirdparty/zlib-*/zutil.h.bak' -delete
          ! grep -rq 'define fdopen(fd,mode) NULL' "$HOME/haxelib/hxcpp"

      - name: Init discord_rpc submodules
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Apply iOS template patches
        run: |
          LT="$HOME/haxelib/lime/git/templates/ios/template"
          cp "templates/ios/template/{{app.file}}/{{app.file}}-Info.plist" "$LT/{{app.file}}/{{app.file}}-Info.plist"
          PBX="$LT/{{app.file}}.xcodeproj/project.pbxproj"
          perl -0pi -e 's/("CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = "::config\.ios\.identity::";)/$1\n\tCODE_SIGNING_ALLOWED = NO;\n\tCODE_SIGNING_REQUIRED = NO;/g' "$PBX"
          grep -c 'CODE_SIGNING_ALLOWED = NO' "$PBX"

      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Configure ad-hoc iOS signing
        run: |
          CONF="$HOME/.lime/config.xml"
          mkdir -p "$HOME/.lime"
          if [ ! -f "$CONF" ]; then printf '<?xml version="1.0" encoding="utf-8"?>\n<config>\n</config>\n' > "$CONF"; fi
          sed -i '' '/<set name="ios.identity"/d' "$CONF"
          sed -i '' 's#</config>#<set name="ios.identity" value="-" /></config>#' "$CONF"
          cat "$CONF"

      - name: Rebuild Lime iOS ndll
        run: haxelib run lime rebuild ios -arm64 -release

      - name: Compile iOS (device, arm64)
        run: haxelib run lime build ios -arm64 --app-version="$APP_VERSION-${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-ios
          path: export/release/ios/build/Release-iphoneos
          if-no-files-found: error
          retention-days: 14
