name: Build

# ============================================================================
# SeiunEngine 构建流（私有仓库友好）
#
# 触发时机：
#   - push 到 main
#   - 针对 main 的 pull_request
#   - 手动触发（Actions 页面 -> Run workflow）
#
# 私有仓库注意事项：
#   - 仓库本身是私有时，Actions 照常工作（Free 套餐每月 2000 分钟）。
#   - checkout 当前仓库不需要任何配置（自动使用 GITHUB_TOKEN）。
#   - hmm.json 里的 flixel / extension-androidtools / hxvlc / linc_luajit
#     指向 mohong2 名下的 4 个私有 fork，因此需要在仓库
#     Settings -> Secrets and variables -> Actions 里配置 GH_PAT
#     （fine-grained PAT，只读这 4 个仓库即可），下面的
#     “Authenticate git for private haxelib deps”步骤会自动生效。
#   - macOS runner 按 10 倍额度计费，默认只在手动触发时构建 mac / iOS。
#   - Android 每次 push / PR 都会构建（签名用的 key.keystore 已在仓库内，
#     密码在 Project.xml 里；正式对外发布前建议迁到 Actions secret）。
# ============================================================================

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HAXE_VERSION: "4.2.5"

jobs:
  buildLinux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          # 按 hmm.json 的内容哈希缓存 haxelib 仓库，命中后跳过几百 MB 下载
          cache-dependency-path: hmm.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev libpulse0 zenity \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev

      - name: Authenticate git for private haxelib deps (optional)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_PAT}" | base64)"
          fi

      - name: Install haxelib dependencies (hmm.json)
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp
          haxelib fixrepo

      - name: Init discord_rpc submodules (haxelib git does not fetch them)
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Read app version from Project.xml
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Compile
        run: haxelib run lime build linux --app-version="$APP_VERSION-${{ github.run_id }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-linux
          path: export/release/linux/bin
          if-no-files-found: error
          retention-days: 14

  buildWindows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Authenticate git for private haxelib deps (optional)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if ($env:GH_PAT) {
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_PAT"))
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $b64"
          }

      - name: Install haxelib dependencies (hmm.json)
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp
          haxelib fixrepo

      - name: Init discord_rpc submodules (haxelib git does not fetch them)
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Read app version from Project.xml
        run: |
          $v = ([xml](Get-Content Project.xml)).project.app.version
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile
        run: haxelib run lime build windows --app-version="$env:APP_VERSION-${{ github.run_id }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-windows
          path: export/release/windows/bin
          if-no-files-found: error
          retention-days: 14

  buildAndroid:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Java 11 (AGP 4.1.3 / Gradle 6.7.1 需要 JDK 11)
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "11"

      - name: Setup Haxe
        uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Authenticate git for private haxelib deps (optional)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_PAT}" | base64)"
          fi

      - name: Install Android SDK components (platform-30 / build-tools 30.0.3)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3" "platform-tools"

      - name: Install haxelib dependencies (hmm.json)
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp
          haxelib fixrepo

      - name: Init discord_rpc submodules (haxelib git does not fetch them)
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Apply engine Android template patches (同 setup/patch-lime-android-templates.bat)
        run: |
          LT="$HOME/haxelib/lime/8,0,1/templates/android/template"
          cp templates/android/template/gradle.properties "$LT/gradle.properties"
          cp templates/android/template/app/src/main/AndroidManifest.xml "$LT/app/src/main/AndroidManifest.xml"
          cp templates/android/template/app/build.gradle "$LT/app/build.gradle"
          mkdir -p "$LT/app/src/main/java/org/haxe/extension" "$LT/app/src/main/res/drawable"
          cp templates/android/java/org/haxe/extension/SeiunOverlay.java "$LT/app/src/main/java/org/haxe/extension/SeiunOverlay.java"
          cp templates/android/template/app/src/main/res/drawable/seiun_ic_keyboard.xml "$LT/app/src/main/res/drawable/seiun_ic_keyboard.xml"

      - name: Read app version from Project.xml
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Compile Android APK
        run: haxelib run lime build android --app-version="$APP_VERSION-${{ github.run_id }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-android
          path: export/release/android/bin
          if-no-files-found: error
          retention-days: 14

  buildMac:
    name: Build macOS
    # linc_luajit 自带的 macOS 预编译库是 x86_64 架构，
    # 因此必须用 Intel 版 runner；arm64 runner 链接会报架构不匹配。
    # macos-15-intel 是官方标签，可用到 2027 年 8 月（之后 Actions 不再提供 x86_64）。
    # macOS runner 按 10 倍额度计费，默认只在“手动触发”时构建；
    # 想每次 push 都构建，删掉下面这一行 if 即可。
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Authenticate git for private haxelib deps (optional)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_PAT}" | base64)"
          fi

      - name: Install haxelib dependencies (hmm.json)
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp
          haxelib fixrepo

      - name: Init discord_rpc submodules (haxelib git does not fetch them)
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Read app version from Project.xml
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Compile
        run: haxelib run lime build mac --app-version="$APP_VERSION-${{ github.run_id }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-mac
          path: export/release/mac/bin
          if-no-files-found: error
          retention-days: 14

  buildIOS:
    name: Build iOS (simulator)
    # 真机 .ipa 需要 Apple 开发者证书 + provisioning profile（要配进 Actions secret），
    # 这里默认先出“不需要签名”的模拟器 .app 来验证编译链路。
    # macOS runner 按 10 倍额度计费，默认只在手动触发时构建。
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Haxe
        uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Authenticate git for private haxelib deps (optional)
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_PAT}" | base64)"
          fi

      - name: Install haxelib dependencies (hmm.json)
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp
          haxelib fixrepo

      - name: Init discord_rpc submodules (haxelib git does not fetch them)
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Apply engine iOS template patches (同 setup/patch-lime-ios-templates.bat)
        run: |
          LT="$HOME/haxelib/lime/8,0,1/templates/ios/template"
          cp "templates/ios/template/{{app.file}}/{{app.file}}-Info.plist" "$LT/{{app.file}}/{{app.file}}-Info.plist"

      - name: Read app version from Project.xml
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Compile iOS simulator app
        run: haxelib run lime build ios -simulator --app-version="$APP_VERSION-${{ github.run_id }}"

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-ios-simulator
          path: export/release/ios/bin
          if-no-files-found: error
          retention-days: 14
