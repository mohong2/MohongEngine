name: Build

# GitHub Actions are pinned to full commit SHAs per repository policy.
# hmm.json points to the private mohong2 fork; configure a read-only GH_PAT
# in repository secrets when private haxelib dependencies are required.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Platform to build (all = all)
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - windows
          - android
          - macos
          - ios

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop:
    name: Desktop
    if: >-
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'linux' ||
      github.event.inputs.platform == 'windows' ||
      github.event.inputs.platform == 'macos'
    uses: ./.github/workflows/build-desktop.yml
    with:
      targets: ${{ github.event.inputs.platform }}
    secrets: inherit

  mobile:
    name: Mobile
    if: >-
      github.event.inputs.platform == 'all' ||
      github.event.inputs.platform == 'android' ||
      github.event.inputs.platform == 'ios'
    uses: ./.github/workflows/build-mobile.yml
    with:
      platforms: ${{ github.event.inputs.platform }}
    secrets: inherit
