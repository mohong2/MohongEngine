name: Build

# Actions 已按仓库策略钉死到完整 commit SHA。
# hmm.json 指向 mohong2 名下的私有 fork，需在仓库 secrets 里配置 GH_PAT（只读）。

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HAXE_VERSION: "4.2.5"

jobs:
  buildLinux:
    name: Build Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libvlc-dev libvlccore-dev libpulse0 zenity \
            libgl1-mesa-dev libglu1-mesa-dev libx11-dev

      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_PAT}" | base64)"
            echo 'git auth configured (GH_PAT found)'
          else
            echo '::warning::GH_PAT not set - private deps will fail'
          fi

      - name: Install haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp

      - name: Init discord_rpc submodules
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Compile
        run: haxelib run lime build linux --app-version="$APP_VERSION-${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-linux
          path: export/release/linux/bin
          if-no-files-found: error
          retention-days: 14

  buildWindows:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if ($env:GH_PAT) {
            $b64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:GH_PAT"))
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $b64"
            Write-Output 'git auth configured (GH_PAT found)'
          } else {
            Write-Output '::warning::GH_PAT not set - private deps will fail'
          }

      - name: Install haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp

      - name: Init discord_rpc submodules
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Read app version
        run: |
          $xml = Get-Content -Raw Project.xml
          $v = [regex]::Match($xml, '<app[^>]*version="([0-9][0-9.]*)"').Groups[1].Value
          "APP_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Compile
        run: haxelib run lime build windows --app-version="$env:APP_VERSION-${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-windows
          path: export/release/windows/bin
          if-no-files-found: error
          retention-days: 14

  buildAndroid:
    name: Build Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17" # sdkmanager 需要 JDK 17

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_PAT}" | base64)"
            echo 'git auth configured (GH_PAT found)'
          else
            echo '::warning::GH_PAT not set - private deps will fail'
          fi

      - name: Install Android SDK components
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-30" "build-tools;30.0.3" "platform-tools"

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "11" # gradle 构建（AGP 4.1.3 / Gradle 6.7.1）需要 JDK 11

      - name: Install haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp

      - name: Init discord_rpc submodules
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Apply Android template patches
        run: |
          LT="$HOME/haxelib/lime/8,0,1/templates/android/template"
          cp templates/android/template/gradle.properties "$LT/gradle.properties"
          cp templates/android/template/app/src/main/AndroidManifest.xml "$LT/app/src/main/AndroidManifest.xml"
          cp templates/android/template/app/build.gradle "$LT/app/build.gradle"
          mkdir -p "$LT/app/src/main/java/org/haxe/extension" "$LT/app/src/main/res/drawable"
          cp templates/android/java/org/haxe/extension/SeiunOverlay.java "$LT/app/src/main/java/org/haxe/extension/SeiunOverlay.java"
          cp templates/android/template/app/src/main/res/drawable/seiun_ic_keyboard.xml "$LT/app/src/main/res/drawable/seiun_ic_keyboard.xml"

      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Compile Android
        run: haxelib run lime build android --app-version="$APP_VERSION-${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-android
          path: export/release/android/bin
          if-no-files-found: error
          retention-days: 14

  buildMac:
    name: Build macOS
    # linc_luajit 预编译库仅 x86_64，须用 Intel runner；macOS 10x 计费，仅手动触发
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_PAT}" | base64)"
            echo 'git auth configured (GH_PAT found)'
          else
            echo '::warning::GH_PAT not set - private deps will fail'
          fi

      - name: Install haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp

      - name: Init discord_rpc submodules
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Compile
        run: haxelib run lime build mac --app-version="$APP_VERSION-${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-mac
          path: export/release/mac/bin
          if-no-files-found: error
          retention-days: 14

  buildIOS:
    name: Build iOS (simulator)
    # 模拟器构建无需签名；真机 .ipa 需 Apple 证书（另行配置 secret）
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json

      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          if [ -n "$GH_PAT" ]; then
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic $(printf '%s' "x-access-token:${GH_PAT}" | base64)"
            echo 'git auth configured (GH_PAT found)'
          else
            echo '::warning::GH_PAT not set - private deps will fail'
          fi

      - name: Install haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp

      - name: Init discord_rpc submodules
        run: |
          cd ~/haxelib/discord_rpc/git
          git submodule update --init --recursive

      - name: Apply iOS template patches
        run: |
          LT="$HOME/haxelib/lime/8,0,1/templates/ios/template"
          cp "templates/ios/template/{{app.file}}/{{app.file}}-Info.plist" "$LT/{{app.file}}/{{app.file}}-Info.plist"

      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"

      - name: Compile iOS (simulator)
        run: haxelib run lime build ios -simulator --app-version="$APP_VERSION-${{ github.run_id }}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-ios-simulator
          path: export/release/ios/bin
          if-no-files-found: error
          retention-days: 14
