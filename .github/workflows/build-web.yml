name: Build Web

on:
  workflow_call:
    inputs:
      publish:
        type: string
        default: 'none'
      release_notes:
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      publish:
        description: '是否发布（none=不发布, alpha=阿尔法, release=正式）'
        required: true
        default: 'none'
        type: choice
        options:
          - none
          - alpha
          - release
      release_notes:
        description: '更新公告 / Release Notes'
        required: false
        default: ''
        type: string

permissions:
  contents: write

env:
  HAXE_VERSION: "4.2.5"

jobs:
  html5:
    name: HTML5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: krdlab/setup-haxe@d93667502be3b4f31a94a3308a74388f2e178a8d # v2.1.0
        with:
          haxe-version: ${{ env.HAXE_VERSION }}
          cache-dependency-path: hmm.json
      - name: Auth private haxelib deps
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          GH_PAT="$(printf '%s' "$GH_PAT" | tr -d '\r\n')"
          if [ -n "$GH_PAT" ]; then
            B64="$(printf '%s' "x-access-token:${GH_PAT}" | base64 | tr -d '\r\n')"
            git config --local --unset-all http.https://github.com/.extraheader || true
            git config --global http.https://github.com/.extraheader "AUTHORIZATION: basic ${B64}"
            git ls-remote https://github.com/mohong2/flixel.git HEAD
          else
            echo '::warning::GH_PAT not set - private deps will fail'
          fi
      - name: Install haxelib dependencies
        run: |
          haxelib setup ~/haxelib
          haxe -cp ./setup -main Main --interp
      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"
      - name: Build HTML5
        run: haxelib run lime build html5 --app-version="$APP_VERSION-${{ github.run_id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: SeiunEngine-html5
          path: export/release/html5/bin
          if-no-files-found: error
          retention-days: 14


  release:
    name: Publish Release
    needs: [html5]
    if: inputs.publish != 'none'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"
      - name: Prepare release metadata
        run: |
          if [ "${{ inputs.publish }}" = "release" ]; then
            echo "TAG_NAME=v${APP_VERSION}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Release v${APP_VERSION}" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=false" >> "$GITHUB_ENV"
          else
            echo "TAG_NAME=v${APP_VERSION}-alpha.${GITHUB_RUN_ID}" >> "$GITHUB_ENV"
            echo "RELEASE_NAME=Alpha v${APP_VERSION} (build ${GITHUB_RUN_ID})" >> "$GITHUB_ENV"
            echo "IS_PRERELEASE=true" >> "$GITHUB_ENV"
          fi
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          github-token: ${{ github.token }}
      - name: Package assets
        run: |
          cd release
          for d in */; do
            if [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              zip -r "${d%/}.zip" "$d"
            fi
          done
          ls -la
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: ${{ env.RELEASE_NAME }}
          prerelease: ${{ env.IS_PRERELEASE }}
          body: |
            ${{ inputs.release_notes }}

            构建产物：
            - HTML5
          files: release/*.zip
