  release:
    name: Publish Alpha Release
    needs: [linux-x64, linux-x86, windows-x64, windows-x86, macos-x64, macos-arm64, android, ios-device, ios-simulator, html5]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Read app version
        run: |
          echo "APP_VERSION=$(sed -n 's/.*<app[^>]*version=\"\([0-9][0-9.]*\)\".*/\1/p' Project.xml | head -n1)" >> "$GITHUB_ENV"
      - name: Download artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release
          github-token: ${{ github.token }}
      - name: Package assets
        run: |
          cd release
          for d in */; do
            if [ -n "$(ls -A "$d" 2>/dev/null)" ]; then
              zip -r "${d%/}.zip" "$d"
            fi
          done
          ls -la
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: v${{ env.APP_VERSION }}-alpha.${{ github.run_id }}
          name: Alpha v${{ env.APP_VERSION }} (build ${{ github.run_id }})
          prerelease: true
          body: |
            自动构建的 alpha 预发布版，极不稳定，谨慎使用。

            平台：
            - Linux x64 / x86
            - Windows x64 / x86
            - macOS x64 / arm64
            - Android
            - iOS Device / Simulator
            - HTML5

            其中 x86、macOS arm64、iOS Simulator 为实验性构建，若依赖库暂缺可能会失败。
          files: release/*.zip
